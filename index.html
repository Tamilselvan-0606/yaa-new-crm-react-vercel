<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yaa Creations CRM</title>
    <meta name="description" content="Yaa Creations CRM — Enterprise Sales, Commerce & Client Management Hub" />
    <meta property="og:title" content="Yaa Creations CRM" />
    <meta property="og:description" content="Enterprise Sales, Commerce & Client Management Hub" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #070B1E;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #070B1E;
        z-index: 99999;
        overflow: hidden;
        user-select: none;
      }
      @keyframes appLoaderSweep {
        0% {
          width: 8%;
          transform: translateX(-10%);
        }
        50% {
          width: 75%;
          transform: translateX(25%);
        }
        100% {
          width: 100%;
          transform: translateX(0%);
        }
      }
      .initial-progress-bar {
        animation: appLoaderSweep 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
      .initial-glow {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-[#070B1E] text-white font-sans antialiased selection:bg-[#4309A2]/20 selection:text-[#33077C]">
    <div id="root">
      <div id="initial-loader">
        <!-- Ambient Radial Background -->
        <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 45%, rgba(67, 9, 162, 0.28) 0%, rgba(15, 20, 42, 0.6) 45%, rgba(7, 11, 30, 1) 85%);"></div>
        <div style="position: absolute; top: -120px; left: -120px; width: 550px; height: 550px; border-radius: 9999px; pointer-events: none; opacity: 0.4; filter: blur(64px); background: radial-gradient(circle, rgba(147, 51, 234, 0.35) 0%, rgba(67, 9, 162, 0) 70%);"></div>
        <div style="position: absolute; bottom: -160px; right: -160px; width: 650px; height: 650px; border-radius: 9999px; pointer-events: none; opacity: 0.35; filter: blur(64px); background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(59, 130, 246, 0.1) 40%, transparent 70%);"></div>

        <!-- Center Emblem & Content -->
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px; text-align: center;">
          <!-- Emblem -->
          <div style="position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px;">
            <div class="initial-glow" style="position: absolute; inset: 0; border-radius: 9999px; filter: blur(20px); background: radial-gradient(circle, rgba(168, 85, 247, 0.6) 0%, rgba(56, 189, 248, 0.4) 60%, transparent 80%);"></div>
            
            <svg style="width: 100%; height: 100%;" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="initRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#a855f7" />
                  <stop offset="50%" stop-color="#38bdf8" />
                  <stop offset="100%" stop-color="#d946ef" />
                </linearGradient>
              </defs>
              <circle cx="80" cy="84" r="44" fill="none" stroke="url(#initRingGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9" />
              <circle cx="80" cy="84" r="44" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
            </svg>

            <!-- Top Node -->
            <div style="position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 52px; height: 52px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; z-index: 10; background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%); box-shadow: 0 0 20px rgba(168, 85, 247, 0.9), 0 0 35px rgba(168, 85, 247, 0.5), inset 0 1.5px 2px rgba(255, 255, 255, 0.6);">
              <svg style="width: 28px; height: 28px; color: #ffffff;" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
              </svg>
            </div>

            <!-- Bottom-Left Node -->
            <div style="position: absolute; bottom: 10px; left: 10px; width: 52px; height: 52px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; z-index: 10; background: linear-gradient(135deg, #c026d3 0%, #9333ea 100%); box-shadow: 0 0 20px rgba(192, 38, 211, 0.9), 0 0 35px rgba(147, 51, 234, 0.5), inset 0 1.5px 2px rgba(255, 255, 255, 0.6);">
              <svg style="width: 28px; height: 28px; color: #ffffff;" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
              </svg>
            </div>

            <!-- Bottom-Right Node -->
            <div style="position: absolute; bottom: 10px; right: 10px; width: 52px; height: 52px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; z-index: 10; background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); box-shadow: 0 0 22px rgba(56, 189, 248, 0.95), 0 0 35px rgba(37, 99, 235, 0.5), inset 0 1.5px 2px rgba(255, 255, 255, 0.7);">
              <svg style="width: 28px; height: 28px; color: #ffffff;" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
              </svg>
            </div>
          </div>

          <!-- Title -->
          <h1 style="font-size: 22px; font-weight: 500; color: #ffffff; margin: 0 0 20px 0; letter-spacing: -0.2px;">
            Loading Yaa Creations CRM...
          </h1>

          <!-- Progress Bar -->
          <div style="width: 280px; height: 8px; background: rgba(30, 41, 59, 0.8); border-radius: 9999px; overflow: hidden; position: relative; border: 1px solid rgba(51, 65, 85, 0.5); margin-bottom: 16px;">
            <div class="initial-progress-bar" style="height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #d946ef 0%, #a855f7 50%, #38bdf8 100%); box-shadow: 0 0 14px rgba(168, 85, 247, 0.8), 0 0 22px rgba(56, 189, 248, 0.5);"></div>
          </div>

          <!-- Subtitle -->
          <p style="font-size: 13px; color: #94a3b8; margin: 0; font-weight: 400; letter-spacing: 0.2px;">
            Preparing your workspace...
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
